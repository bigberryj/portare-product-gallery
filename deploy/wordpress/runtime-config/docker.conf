allowSymbolLink           1
enableScript              1
restrained                1
setUIDMode                0
vhRoot                    /var/www/html/
configFile                $SERVER_ROOT/conf/vhosts/localhost/vhconf.conf

virtualHostConfig  {
  docRoot                 /var/www/html/
  enableGzip              1

  errorlog  {
    useServer             1
  }

  accesslog $SERVER_ROOT/logs/localhost.access.log {
    useServer             0
    rollingSize           10M
    keepDays              7
    compressArchive       1
  }

  index  {
    useServer             0
    indexFiles            index.html, index.php
    autoIndex             0
    autoIndexURI          /_autoindex/default.php
  }

  expires  {
    enableExpires         1
  }

  accessControl  {
    allow                 *
  }

  context / {
    location              /var/www/html/
    allowBrowse           1

    rewrite  {
      enable              1
      autoLoadHtaccess    1
      logLevel            0
    }
  }

  rewrite  {
    enable                1
    autoLoadHtaccess      1
    logLevel              0
  }

  vhssl  {
    keyFile               /root/.acme.sh/certs/localhost_ecc/localhost.key
    certFile              /root/.acme.sh/certs/localhost_ecc/fullchain.cer
    certChain             1
  }
}